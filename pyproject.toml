[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pydhcp3"
version = "0.0.7"
requires-python = ">=3.8"
dependencies = [
    'pyderive3>=0.0.7',
    'pystructs3>=0.0.8',
    'pyserve3>=0.0.8',
    'typing_extensions>=4.7.1',
]
authors = [{name = "Andrew C Scott", email = "imgurbot12@gmail.com"}]
description = "Simple Python DHCP Library. DHCP Packet-Parsing/Client/Server"
readme = {file = "README.md", content-type = "text/markdown"}
keywords = ["dhcp", "client", "server", "parser"]
classifiers = [
    "Typing :: Typed",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15"
]

[project.urls]
Repository = "https://github.com/imgurbot12/pydhcp"

[tool.setuptools.package-data]
"pydhcp3" = ["py.typed"]
